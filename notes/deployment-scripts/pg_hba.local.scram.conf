# pg_hba.conf baseline for local-only app access
# Prefer SCRAM auth and do not expose Postgres publicly

# Unix socket
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# Loopback TCP only
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
